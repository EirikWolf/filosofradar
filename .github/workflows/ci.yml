# CI for filosofradar. Repoet er offentlig, så vi bruker GitHub-hostede runnere
# (gratis for offentlige repoer). Self-hosted runnere skal aldri kjøre kode fra
# PR-er i et offentlig repo, fordi hvem som helst kan åpne en PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Sjekk og bygg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # src/generated/ er gitignorert og lages fra content/. Uten dette steget
      # feiler typecheck på en fersk klon (lokalt ligger filene der fra før).
      - name: Generer innhold
        run: npx tsx scripts/build-content.ts
      # typecheck + lint + test + innholdsvalidering
      - run: npm run check
      - run: npm run build
      # Ytelsesbudsjett: JS på første side < 200 kB gzip (global CLAUDE.md).
      - run: npm run budget
      # Røyktest i Chromium mot det bygde nettstedet (B-018). Ligger i samme jobb som
      # bygget, så den gjenbruker dist/ og omfattes av regelsettet for main uten endring.
      - name: Hent Playwright-versjon
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Mellomlager for Chromium
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Installer Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Installer systempakker for Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Røyktest (Playwright)
        run: npm run e2e
      - name: Last opp Playwright-rapport ved feil
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 7
