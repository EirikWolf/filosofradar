# Dependabot for Filosofradaren.
#
# Ukentlig kadens og et tak på fem åpne PR-er holder støyen nede. Sikkerhets-
# oppdateringer teller ikke mot taket, så det bremser dem ikke.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node følger KJØRETIDEN, ikke nyeste utgivelse. CI bygger på
      # node 24; #23 foreslo typene 22 -> 26. Typer foran kjøretiden fjerner
      # den ene sjekken som stopper kode noden ikke kan kjøre (samme regel som
      # i HR_system og KvalitetsPuls). Minor/patch slipper.
      #
      # UTLØSER: løft typene i samme endring som node-version i ci.yml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Sikkerhetsoppdateringer samles i én PR så de kan vurderes samlet.
      sikkerhetsoppdateringer:
        applies-to: security-updates
        patterns:
          - "*"
      byggkjede:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "typescript"
        # Store versjonshopp (Vite, Tailwind, TypeScript) krever en plan og kommer
        # derfor som egne PR-er, ikke samlet med rutineoppdateringer (B-013).
        update-types:
          - minor
          - patch
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      ovrige-patch-og-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
