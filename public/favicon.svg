<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#040714"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe885"/>
      <stop offset="60%" stop-color="#f6c445"/>
      <stop offset="100%" stop-color="#f6c445" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Radar orbit rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="2 2"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#f6c445" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- Radar axis lines -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Radar sweep segment -->
  <path d="M 32 32 L 53 20 A 24 24 0 0 0 32 8 Z" fill="url(#sweep)"/>

  <!-- Star nodes representing philosophers -->
  <circle cx="44" cy="18" r="1.5" fill="#38bdf8"/>
  <circle cx="20" cy="22" r="1.5" fill="#f6c445"/>
  <circle cx="46" cy="42" r="1.2" fill="#e879f9"/>
  <circle cx="18" cy="44" r="1.4" fill="#34d399"/>
  <circle cx="38" cy="48" r="1.2" fill="#fb923c"/>

  <!-- Central Star / Compass Rose -->
  <circle cx="32" cy="32" r="5" fill="url(#goldGlow)"/>
  <!-- 8-pointed star -->
  <polygon points="32,23 34,29.5 41,32 34,34.5 32,41 30,34.5 23,32 30,29.5" fill="#ffd15c"/>
  <polygon points="32,26 33.5,30.5 38,32 33.5,33.5 32,38 30.5,33.5 26,32 30.5,30.5" fill="#ffffff"/>
</svg>
